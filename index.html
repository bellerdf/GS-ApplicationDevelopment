<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Ponto SP - SPTrans Olho Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="brand">
                <span class="badge-sptrans">SPTrans</span>
                <h1>Meu Ponto SP</h1>
            </div>
            <p>Monitoramento e previsão de chegada de ônibus em tempo real</p>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <h2>Consultar Parada ou Endereço</h2>
            <div class="search-box">
                <input type="text" id="input-termo" placeholder="Ex: Av Paulista, Lapa, Consolação...">
                <button onclick="buscarParadas()">Buscar</button>
            </div>
        </section>

        <section id="resultados-section" class="hidden">
            <h2 class="section-title">Selecione a Parada</h2>
            <div id="lista-paradas" class="card-grid"></div>
        </section>

        <section id="previsao-section" class="hidden">
            <div class="previsao-header">
                <h2 id="titulo-parada" class="section-title">Previsão para o Ponto</h2>
                <button class="btn-voltar" onclick="voltarParaBuscas()">← Trocar Parada</button>
            </div>
            <div id="lista-previsoes" class="card-grid"></div>
        </section>
    </main>

    <footer>
        <p>Integrado à <strong>API Olho Vivo — SPTrans</strong> • Global Solution FIAP</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
